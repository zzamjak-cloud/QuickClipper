# 매일 아침 AI 데일리 리포트 생성 — collect(수집) → summarize(Claude Code 헤드리스 요약) → publish(Firestore 저장).
# GitHub 크론은 지연·누락이 잦아 30분 간격으로 재시도하고, 이미 발행된 날짜는 collect 단계에서 건너뛴다.
name: Daily Collect

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 KST
    - cron: "30 21 * * *" # 06:30 KST 재시도
    - cron: "0 22 * * *" # 07:00 KST 재시도
    - cron: "0 0 1 * *" # 매월 1일 keepalive
  workflow_dispatch:
    inputs:
      force:
        description: 기존 다이제스트가 있어도 재생성
        type: boolean
        default: false

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 수집 (candidates.json)
        run: npm run collect
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_COLLECT: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}

      # 이후 단계는 후보 파일이 있을 때만 실행 (이미 발행된 날짜면 collect가 파일을 만들지 않음).
      # 일부 소스 실패로 collect가 실패해도 후보가 있으면 발행은 진행한다.
      - name: Claude Code 설치
        if: ${{ !cancelled() && hashFiles('collector/out/candidates.json') != '' }}
        run: npm i -g @anthropic-ai/claude-code

      - name: 요약 (report.json)
        if: ${{ !cancelled() && hashFiles('collector/out/candidates.json') != '' }}
        # 요약 실패 시 publish가 원문으로 폴백하므로 잡을 멈추지 않는다
        continue-on-error: true
        timeout-minutes: 12
        run: npm run summarize
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: 발행 (Firestore)
        if: ${{ !cancelled() && hashFiles('collector/out/candidates.json') != '' }}
        run: npm run publish
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

  # 저장소 활동이 60일 없으면 예약 워크플로가 자동 비활성화되므로 매월 다시 활성화한다
  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 워크플로 재활성화
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collect.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
